print("""
Loading mrm from mrm.apk
""")

import sys
import asyncio
import platform
from pathlib import Path

async def custom_site():

    import embed

    platform.document.body.style.background = "#000000"

    platform.window.transfer.hidden = True
    platform.window.canvas.style.visibility = "visible"

    bundle = "mrm"

    appdir = Path(f"/data/data/{bundle}")
    appdir.mkdir(exist_ok=True)

    if platform.window.location.host.find('.itch.zone') > 0:
        import zipfile

        async with platform.fopen("mrm.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())

    else:

        import tarfile

        async with platform.fopen("mrm.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    platform.run_main(
        PyConfig,
        loaderhome=appdir / "assets",
        loadermain=None
    )

    while embed.counter() < 0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    if not platform.window.MM.UME:

        __import__(__name__).__file__ = main

        msg = "Touch screen to start"

        platform.window.infobox.innerText = msg

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    await TopLevel_async_handler.start_toplevel(
        platform.shell,
        console=window.python.config.debug
    )

    __import__(__name__).__file__ = main

    await shell.source(main)

    platform.window.infobox.style.display = "none"

    platform.window.config.gui_divider = 1

    platform.window.window_resize()

    shell.interactive()

asyncio.run(custom_site())

</script>

<script>

function forceLandscape() {

    if (screen.orientation && screen.orientation.lock) {

        screen.orientation
        .lock("landscape")
        .catch(()=>{})

    }

}

function enterFullscreen() {

    let elem = document.documentElement

    if (elem.requestFullscreen) {

        elem.requestFullscreen()

    } else if (elem.webkitRequestFullscreen) {

        elem.webkitRequestFullscreen()

    } else if (elem.msRequestFullscreen) {

        elem.msRequestFullscreen()

    }

}

function hideBars() {

    setTimeout(() => {

        window.scrollTo(0, 1)

    }, 100)

}

window.addEventListener("load", () => {

    hideBars()

    forceLandscape()

})

document.addEventListener("click", () => {

    enterFullscreen()

    forceLandscape()

    hideBars()

}, { once:true })

document.addEventListener("touchstart", () => {

    enterFullscreen()

    forceLandscape()

    hideBars()

}, { once:true })

</script>
