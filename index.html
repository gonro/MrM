import asyncio
import platform
from pathlib import Path

async def custom_site():

    import embed

    platform.document.body.style.background = "#000000"

    platform.window.transfer.hidden = True
    platform.window.canvas.style.visibility = "visible"

    bundle = "mrm"

    appdir = Path(f"/data/data/{bundle}")
    appdir.mkdir(exist_ok=True)

    # EXTRAER ARCHIVOS
    if platform.window.location.host.find('.itch.zone') > 0:
        import zipfile
        async with platform.fopen("mrm.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("mrm.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    platform.run_main(
        PyConfig,
        loaderhome=appdir / "assets",
        loadermain=None
    )

    # ESPERAR PRELOAD
    while embed.counter() < 0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    __import__(__name__).__file__ = main

    # NO mostramos "Ready to start"
    # NO esperamos interacción manual

    try:
        platform.window.MM.UME = True
    except:
        pass

    await TopLevel_async_handler.start_toplevel(
        platform.shell,
        console=window.python.config.debug
    )

    def ui_callback(pkg):
        try:
            platform.window.updateLoaderText(f"Cargando {pkg}")
        except:
            pass

    await shell.source(main, callback=ui_callback)

    # OCULTAR LOADER
    platform.window.hideLoader()

    platform.window.config.gui_divider = 1
    platform.window.window_resize()

    shell.interactive()

asyncio.run(custom_site())

# --></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

/* CANVAS */

canvas.emscripten{
    position:fixed !important;
    inset:0 !important;

    width:100vw !important;
    height:100vh !important;

    border:none;
    outline:none;

    background:#000;
    z-index:1;

    touch-action:none;
}

/* LOADER */

#mrm-loader{
    position:fixed;
    inset:0;

    z-index:999999;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:
    radial-gradient(
    circle at top,
    #1a1a1a 0%,
    #090909 45%,
    #000000 100%);

    color:white;

    overflow:hidden;
}

/* GLOW */

#mrm-loader::before{
    content:"";

    position:absolute;

    width:600px;
    height:600px;

    background:
    radial-gradient(
    circle,
    rgba(255,255,255,0.07) 0%,
    rgba(255,255,255,0.02) 30%,
    transparent 70%);

    filter:blur(20px);

    animation:glow 6s ease-in-out infinite;
}

@keyframes glow{
    0%{transform:scale(1);}
    50%{transform:scale(1.08);}
    100%{transform:scale(1);}
}

/* TITLE */

.mrm-title{

    position:relative;

    font-size:clamp(56px,8vw,110px);

    font-weight:900;

    letter-spacing:18px;

    text-transform:uppercase;

    color:#fff;

    text-shadow:
    0 0 20px rgba(255,255,255,0.10),
    0 0 50px rgba(255,255,255,0.08);

    animation:titlePulse 4s ease-in-out infinite;
}

@keyframes titlePulse{
    0%{opacity:0.9;}
    50%{opacity:1;}
    100%{opacity:0.9;}
}

/* SUB */

.mrm-sub{
    margin-top:16px;

    font-size:12px;

    letter-spacing:4px;

    color:#666;

    text-transform:uppercase;
}

/* RING */

.loader-ring{
    width:92px;
    height:92px;

    margin-top:46px;

    border-radius:50%;

    border:2px solid rgba(255,255,255,0.08);

    border-top-color:#ffffff;

    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

/* STATUS */

#mrm-status{

    margin-top:30px;

    font-size:13px;

    letter-spacing:3px;

    color:#cfcfcf;

    text-transform:uppercase;
}

/* FOOTER */

.mrm-footer{

    position:absolute;

    bottom:44px;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:18px;
}

.footer-line{
    width:50px;
    height:1px;
    background:#1e1e1e;
}

.footer-text{
    color:#5a5a5a;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    text-align:center;
    line-height:1.8;
}

/* PLATFORMS */

.platforms{
    display:flex;
    align-items:center;
    gap:34px;
}

.platform{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;

    opacity:0.34;
}

.platform svg{
    width:24px;
    height:24px;
    fill:white;
}

.platform span{
    font-size:9px;
    letter-spacing:2px;
    color:#555;
    text-transform:uppercase;
}

/* iOS Overlay */

#ios-overlay{
    position:fixed;
    inset:0;

    display:none;
    align-items:flex-end;
    justify-content:center;

    background:rgba(0,0,0,0.82);

    z-index:9999999;
}

#ios-overlay.visible{
    display:flex;
}

#ios-card{
    width:100%;
    max-width:480px;

    background:#1c1c1e;

    border-radius:22px 22px 0 0;

    padding:28px;

    color:white;

    text-align:center;
}

#ios-card h2{
    margin-bottom:10px;
}

#ios-card p{
    color:#999;
    line-height:1.7;
    margin-bottom:24px;
}

#ios-btn{
    width:100%;
    height:52px;

    border:none;
    border-radius:12px;

    background:#2c2c2e;

    color:white;

    font-size:15px;
}

</style>

<script>

config = {
    xtermjs : "0",
    _sdl2 : "canvas",
    user_canvas : 0,
    user_canvas_managed : 0,
    gui_divider : 1,
    ume_block : 0,
    can_close : 0,
    archive : "mrm",
    gui_debug : 0,
    cdn : "https://pygame-web.github.io/cdn/0.9.3/",
    autorun : 1,
    PYBUILD : "3.12",
    fb_ar : 1.77,
    fb_width : "1280",
    fb_height : "720"
}

function updateLoaderText(txt){

    const el = document.getElementById("mrm-status")

    if(el){
        el.innerText = txt
    }
}

function hideLoader(){

    const loader = document.getElementById("mrm-loader")

    if(loader){

        loader.style.opacity = "0"
        loader.style.transition = "opacity .7s ease"

        setTimeout(()=>{
            loader.remove()
        },700)
    }
}

/* FULLSCREEN */

function enterFullscreen(){

    const el = document.documentElement

    if(el.requestFullscreen){
        el.requestFullscreen().catch(()=>{})
    }
    else if(el.webkitRequestFullscreen){
        el.webkitRequestFullscreen()
    }
}

function lockLandscape(){

    if(screen.orientation && screen.orientation.lock){
        screen.orientation.lock("landscape").catch(()=>{})
    }
}

function firstGesture(){

    enterFullscreen()
    lockLandscape()

    const ov = document.getElementById("ios-overlay")

    if(ov){
        ov.classList.remove("visible")
    }
}

document.addEventListener(
"pointerdown",
firstGesture,
{once:true}
)

/* iOS */

window.addEventListener("load",()=>{

    const isIOS =
    /iphone|ipad|ipod/i.test(navigator.userAgent)

    const isSafari =
    /safari/i.test(navigator.userAgent)
    &&
    !/chrome|crios|fxios/i.test(navigator.userAgent)

    const standalone =
    ("standalone" in navigator)
    &&
    navigator.standalone

    if(isIOS && isSafari && !standalone){

        setTimeout(()=>{

            document
            .getElementById("ios-overlay")
            .classList.add("visible")

        },2500)
    }
})

</script>

</head>
